  <script>
    (function () {
      var LAT = 37.4920415, LNG = 126.9242281;

      function initNaverMap() {
        var container = document.getElementById('naver-map');
        if (!container || container.__naverMapReady) return;
        container.__naverMapReady = true;

        var map = new naver.maps.Map(container, {
          center: new naver.maps.LatLng(LAT, LNG),
          zoom: 17,
          mapTypeControl: false,
          scaleControl: false,
          logoControl: true,
          mapDataControl: false,
          zoomControl: false,
          tileSpare: 2
        });

        new naver.maps.Marker({
          position: new naver.maps.LatLng(LAT, LNG),
          map: map,
          title: '더에스비웨딩컨벤션'
        });
      }

      // React 렌더링 후 #naver-map 이 DOM에 추가되는 시점 감지
      var observer = new MutationObserver(function () {
        if (document.getElementById('naver-map')) {
          observer.disconnect();
          initNaverMap();
        }
      });

      function start() {
        initNaverMap();
        observer.observe(document.body, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>
